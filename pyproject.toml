[project]
name = "financial-research-agent"
version = "0.1.0"
description = "A LangGraph multi-agent financial research app powered by local MCP servers."
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9.0.0",
  "langchain-mcp-adapters>=0.2.0",
  "langchain-openai>=1.0.0",
  "langgraph>=1.0.0",
  "mcp>=1.10.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.40.0",
  "yfinance>=0.2.50",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.9.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]

